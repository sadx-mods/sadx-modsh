<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0a0c">
<title>🥷 SADX-MODS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#09090b;--s1:#141418;--s2:#1c1c22;--line:#25252d;--line2:#34343e;--text:#f6f6f8;--mut:#9494a0;--acc:#eab308;--acc2:#ffd24e;--accg:linear-gradient(135deg,#ffd24e 0%,#eab308 55%,#a67d02 100%);
--ui:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--disp:"Plus Jakarta Sans",system-ui,sans-serif;
--glyph:"Segoe UI Symbol","Noto Sans Symbols 2","Noto Sans Symbols","Noto Sans CJK JP","Noto Sans JP",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark;scroll-behavior:smooth}
::selection{background:rgba(234,179,8,.35);color:#fff}
body{background:var(--bg);color:var(--text);font-family:var(--ui);font-size:15px;font-weight:400;line-height:1.5;min-height:100vh;padding-bottom:72px;-webkit-font-smoothing:antialiased;position:relative}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(900px 480px at 85% -8%,rgba(234,179,8,.15),transparent 62%),radial-gradient(700px 420px at -10% 8%,rgba(255,210,78,.07),transparent 60%),radial-gradient(600px 400px at 50% 115%,rgba(166,125,2,.07),transparent 60%)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#2a2a33;border-radius:10px;border:2px solid var(--bg)}::-webkit-scrollbar-thumb:hover{background:#3a3a46}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none;pointer-events:none}
header{display:flex;align-items:center;gap:18px;margin:22px 0 10px;padding:22px 24px;border-radius:28px;position:relative;overflow:hidden;isolation:isolate;background:linear-gradient(125deg,rgba(255,255,255,.07),rgba(255,255,255,.012) 48%,rgba(234,179,8,.07)),#121216;border:1px solid rgba(255,255,255,.09);box-shadow:0 26px 60px -26px rgba(0,0,0,.95),0 0 0 1px rgba(234,179,8,.08),0 0 60px -30px rgba(234,179,8,.6),inset 0 1px 0 rgba(255,255,255,.1);animation:hin .8s cubic-bezier(.2,.7,.2,1) both}
header::before{content:"";position:absolute;z-index:-1;right:-80px;top:-110px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(234,179,8,.38),transparent 68%);pointer-events:none}
header::after{content:"";position:absolute;z-index:-1;inset:0;background:repeating-linear-gradient(115deg,transparent 0 22px,rgba(255,255,255,.018) 22px 23px);-webkit-mask-image:linear-gradient(90deg,transparent,#000 70%);mask-image:linear-gradient(90deg,transparent,#000 70%);pointer-events:none}
@keyframes hin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.logo{position:relative;width:70px;height:70px;border-radius:23px;flex:none;background:linear-gradient(145deg,#ffd24e 0%,#eab308 50%,#906900 100%);display:grid;place-items:center;color:#fff;overflow:visible;box-shadow:0 14px 34px -8px rgba(234,179,8,.75),inset 0 1.5px 0 rgba(255,255,255,.5),inset 0 -8px 14px rgba(78,55,0,.35)}
.logo::before{content:"";position:absolute;inset:-7px;border-radius:29px;padding:1.5px;background:conic-gradient(from 210deg,#ffd65f,rgba(255,214,95,0) 28%,#a6790200 45%,#c79406 70%,#ffd65f);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);pointer-events:none}
.logo img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block;position:relative;z-index:1}
.logo .i{width:32px;height:32px;stroke-width:1.9;filter:drop-shadow(0 2px 4px rgba(68,49,0,.45))}
header>div:last-child{position:relative;min-width:0}
.pname{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{font-family:var(--disp);font-weight:800;font-size:30px;letter-spacing:-.035em;line-height:1.05;filter:drop-shadow(0 2px 14px rgba(234,179,8,.4));background:linear-gradient(180deg,#fff 35%,#ffedbd);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
header p{margin-top:5px;font-size:13px;font-weight:600;letter-spacing:.035em;background:linear-gradient(90deg,#ffd96e,#c9bb97 60%,#8f8890);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hr{position:relative;height:1px;margin:8px 4px;background:linear-gradient(90deg,transparent,rgba(234,179,8,.6) 18%,rgba(255,255,255,.14) 50%,rgba(234,179,8,.6) 82%,transparent)}
.hr::after{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;border-radius:2px;background:var(--accg);transform:translate(-50%,-50%) rotate(45deg);box-shadow:0 0 10px rgba(234,179,8,.8)}
.hr.soft{margin:2px 4px 0}
.tabs{display:flex;gap:8px;overflow-x:auto;position:sticky;top:0;z-index:5;background:linear-gradient(180deg,rgba(10,10,12,.92) 70%,rgba(10,10,12,0));-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:10px 2px 12px;margin:0 -2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{--c:var(--acc);flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:10px 17px;background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:999px;color:var(--mut);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;transition:all .2s}
.tab:hover{color:var(--text);border-color:var(--line2);background:rgba(255,255,255,.06)}
.tab.on:hover{color:#fff;border-color:transparent}
.tab.on{background:var(--accg);border-color:transparent;color:#fff;box-shadow:0 8px 22px -8px rgba(234,179,8,.75),inset 0 1px 0 rgba(255,255,255,.35)}
.panel{display:none}.panel.on{display:block}
.box{background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01)),var(--s1);border:1px solid var(--line);border-radius:20px;padding:17px;margin-top:13px;box-shadow:0 14px 40px -24px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.04)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--s2);color:var(--text);border:1px solid var(--line2);padding:9px 16px;border-radius:999px;cursor:pointer;font:inherit;font-size:14px;font-weight:600;transition:all .18s}
button:hover{border-color:var(--acc);color:var(--acc)}
button:focus-visible,.tab:focus-visible,.sym span:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
@property --ang{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes spin{to{--ang:360deg}}
.searchbar{margin-top:16px}
.search{position:relative;display:block;border-radius:26px;padding:1.5px;isolation:isolate;background:conic-gradient(from var(--ang),rgba(255,255,255,.1) 0%,#ffd24e 12%,#eab308 24%,rgba(255,255,255,.1) 40%,rgba(255,255,255,.1) 60%,#a67d02 78%,rgba(255,255,255,.1) 100%);animation:spin 5s linear infinite;box-shadow:0 18px 44px -18px rgba(234,179,8,.55)}
.search::after{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;box-shadow:0 0 36px -8px rgba(234,179,8,.35);opacity:.6;transition:opacity .3s}
.search:focus-within::after{opacity:1;box-shadow:0 0 46px -4px rgba(234,179,8,.6)}
.search>.i{position:absolute;z-index:3;left:12px;top:50%;transform:translateY(-50%);width:44px;height:44px;padding:11px;border-radius:17px;background:linear-gradient(145deg,#ffd24e,#eab308 55%,#906900);color:#fff;stroke-width:2.2;box-shadow:0 10px 22px -8px rgba(234,179,8,.9),inset 0 1.5px 0 rgba(255,255,255,.45),inset 0 -5px 8px rgba(78,55,0,.3);pointer-events:none}
.search input{position:relative;z-index:1;display:block;width:100%;height:66px;padding:0 112px 0 70px;border-radius:24.5px;background:linear-gradient(100deg,rgba(234,179,8,.13),rgba(255,255,255,.03) 38%,rgba(255,255,255,.01)),#0f0f13;border:0;color:#fff;font:inherit;font-size:18px;font-weight:700;letter-spacing:.015em;outline:none;box-shadow:inset 0 2px 12px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.07);caret-color:var(--acc2)}
.search input::placeholder{color:#6a6a76;font-weight:500;letter-spacing:.01em}
.search input:focus{background:linear-gradient(100deg,rgba(234,179,8,.2),rgba(255,255,255,.04) 42%,rgba(255,255,255,.015)),#0f0f13}
.sr{position:absolute;z-index:3;right:14px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:8px}
.sc{font-size:12px;font-weight:600;color:var(--mut);background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:4px 10px;font-variant-numeric:tabular-nums}
.sc b{color:var(--text);font-weight:800}
.sc.max b{color:var(--acc2)}
.sx{width:32px;height:32px;padding:0;border-radius:50%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:var(--mut)}
.sx[hidden]{display:none}
.sx .i{position:static;transform:none;width:15px;height:15px;padding:0;background:none;box-shadow:none;border-radius:0;stroke-width:2.4;color:inherit}
.sx:hover{background:var(--accg);border-color:transparent;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:14px}
.nm{--c:var(--acc);position:relative;overflow:hidden;display:grid;grid-template-columns:1fr auto;gap:3px 14px;align-items:center;background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.01) 60%),var(--s1);border:1px solid var(--line);border-radius:20px;padding:14px 12px 13px 18px;box-shadow:0 12px 30px -20px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.045);transition:border-color .25s,transform .25s,box-shadow .25s}
.nm::before{content:"";position:absolute;left:0;top:18%;bottom:18%;width:3px;border-radius:0 3px 3px 0;background:var(--accg);opacity:.55;transition:opacity .25s,top .25s,bottom .25s}
.nm::after{content:"";position:absolute;right:-40px;top:-40px;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 22%,transparent),transparent 70%);opacity:0;transition:opacity .3s;pointer-events:none}
.nm:hover{border-color:color-mix(in srgb,var(--c) 70%,transparent);transform:translateY(-2px);box-shadow:0 18px 38px -18px rgba(234,179,8,.35),inset 0 1px 0 rgba(255,255,255,.06)}
.nm:hover::before{opacity:1;top:10%;bottom:10%}.nm:hover::after{opacity:1}
.nm .t{grid-column:1;grid-row:1;font-family:var(--glyph);font-size:22px;font-weight:400;line-height:1.28;min-height:29px;word-break:break-all;position:relative;z-index:1}
.nm .m{grid-column:1;grid-row:2;font-size:11.5px;color:var(--mut);display:flex;align-items:center;gap:6px;position:relative;z-index:1;font-weight:500}
.nm .m::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);flex:none}
.nm .c{grid-column:2;grid-row:1/3;flex-direction:column;gap:4px;width:58px;height:52px;padding:0;border-radius:16px;border:1px solid color-mix(in srgb,var(--c) 30%,transparent);background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);font-size:10.5px;font-weight:700;position:relative;z-index:1}
.nm .c .i{width:17px;height:17px}
.nm .c::before{content:"";position:absolute;left:-8px;top:-9px;bottom:-9px;width:1px;background:linear-gradient(transparent,rgba(255,255,255,.16) 30%,rgba(255,255,255,.16) 70%,transparent);pointer-events:none}
.nm .c:hover,.nm .c.done{background:var(--accg);border-color:transparent;color:#fff;box-shadow:0 8px 20px -8px rgba(234,179,8,.8)}
.sec{margin:21px 0 10px;color:var(--text);font-family:var(--disp);font-size:13.5px;font-weight:700;letter-spacing:.01em;display:flex;align-items:center;gap:10px}
.sec::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--accg);box-shadow:0 0 10px rgba(234,179,8,.6)}
.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
.sec:first-child{margin-top:0}
.sym{display:flex;flex-wrap:wrap;gap:7px}
.sym span{min-width:41px;text-align:center;padding:7px 10px;background:var(--s2);border:1px solid var(--line);border-radius:12px;cursor:pointer;font-family:var(--glyph);font-size:18px;user-select:none;transition:all .15s}
.sym span:hover{border-color:var(--acc);color:var(--acc2);background:rgba(234,179,8,.12);box-shadow:0 6px 16px -8px rgba(234,179,8,.6);transform:translateY(-1px)}
.sym span.mono{background:#e9e9ee;border-color:transparent;color:#0a0a0c}
.sym span.mono i{font-style:normal;filter:brightness(0)}
.sym span.mono:hover{background:#fff;color:#0a0a0c;border-color:var(--acc);box-shadow:0 6px 16px -8px rgba(234,179,8,.7)}
.sym span:active{transform:scale(.94)}
#symList .blk{margin-bottom:6px}
.sec.fold{cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}
.sec .cnt{font-size:11px;font-weight:600;color:var(--mut);background:var(--s2);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.sec .chv{width:16px;height:16px;color:var(--mut);transition:transform .2s}
.sec.open .chv{transform:rotate(180deg)}
.sec .tg{font-size:10.5px;font-weight:700;color:#ffdf83;background:rgba(234,179,8,.12);border:1px solid rgba(234,179,8,.32);border-radius:999px;padding:2px 9px}
.ld{margin-top:12px}
.spc{padding:14px}
.sprow{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;padding:12px 12px 12px 12px;border-radius:20px;background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.01) 60%),var(--s1);border:1px solid var(--line);box-shadow:0 12px 30px -20px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.045)}
.sprow::before{content:"";position:absolute;left:0;top:18%;bottom:18%;width:3px;border-radius:0 3px 3px 0;background:var(--accg);opacity:.8}
.spbox{position:relative;flex:none;width:56px;height:56px;margin-left:6px;padding:0;border-radius:16px;border:1.5px dashed rgba(234,179,8,.55);background:var(--s2);font-size:22px}
.spbox::before,.spbox::after{content:"";position:absolute;top:50%;width:7px;height:20px;transform:translateY(-50%);border:2px solid var(--acc);transition:all .2s}
.spbox::before{left:9px;border-right:0;border-radius:4px 0 0 4px}.spbox::after{right:9px;border-left:0;border-radius:0 4px 4px 0}
.spbox:hover{border-style:solid;color:var(--text)}.spbox:hover::before{left:12px}.spbox:hover::after{right:12px}
.spch{font-family:var(--glyph)}
.spin{flex:1;min-width:0}
.spin b{display:block;font-size:15px;font-weight:700;line-height:1.25}
.spin span{display:block;font-size:11.5px;color:var(--mut);font-weight:500;margin-top:2px}
.spbtn{flex:none;height:46px;padding:0 20px;border-radius:15px;border:1px solid rgba(255,255,255,.18);background:var(--accg);color:#fff;font-size:14px;font-weight:700;box-shadow:0 10px 22px -10px rgba(234,179,8,.9),inset 0 1px 0 rgba(255,255,255,.4)}
.spbtn .i{width:17px;height:17px}
.spbtn:hover{color:#fff;border-color:rgba(255,255,255,.3);filter:brightness(1.08)}
.spbtn:active{transform:scale(.96)}
.spbtn.done{background:#26262d;border-color:var(--line2);color:var(--text);box-shadow:none}
.empty{color:var(--mut);text-align:center;padding:56px 10px;grid-column:1/-1;font-weight:500}
.more{display:none}
#toast{position:fixed;top:auto;right:auto;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:min(340px,calc(100vw - 24px));display:flex;align-items:center;gap:13px;text-align:left;padding:14px 18px 15px 14px;border-radius:18px;overflow:hidden;background:rgba(20,20,25,.94);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.1);box-shadow:0 22px 50px -14px rgba(0,0,0,.95),0 0 34px -12px rgba(234,179,8,.55);z-index:1200;pointer-events:none;opacity:0;transform:translate(-50%,160%);transition:transform .38s cubic-bezier(.2,.85,.25,1),opacity .25s}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast .ti{width:38px;height:38px;border-radius:12px;flex:none;display:grid;place-items:center;color:#fff;background:var(--accg);box-shadow:0 8px 18px -8px rgba(234,179,8,.9),inset 0 1px 0 rgba(255,255,255,.35)}
#toast .ti .i{width:19px;height:19px;stroke-width:2.4}
#toast b{display:block;font-size:14px;font-weight:700;line-height:1.25;color:var(--text)}
#toast span{display:block;font-size:12px;font-weight:500;color:var(--mut);margin-top:1px}
#toast::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--accg);transform:scaleX(0);transform-origin:left}
#toast.show::after{animation:tbar 2s linear forwards}
@keyframes tbar{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@media (max-width:520px){.grid{grid-template-columns:1fr}header{padding:15px 16px;gap:14px;border-radius:22px}header h1{font-size:23px}.logo{width:54px;height:54px;border-radius:18px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}html{scroll-behavior:auto}}

/* Animated spectrum refresh: original generator features remain intact */
:root{--acc:#22d3ee;--acc2:#a78bfa;--accg:linear-gradient(120deg,#22d3ee,#a78bfa,#f472b6,#34d399,#22d3ee)}
body{background:#070a12;isolation:isolate}
body::before{z-index:-1;background:radial-gradient(850px 520px at 12% 0%,rgba(34,211,238,.19),transparent 62%),radial-gradient(720px 460px at 92% 12%,rgba(167,139,250,.19),transparent 62%),radial-gradient(700px 500px at 52% 100%,rgba(244,114,182,.12),transparent 62%);animation:ambientShift 16s ease-in-out infinite alternate}
@keyframes ambientShift{0%{filter:hue-rotate(0deg);transform:scale(1)}100%{filter:hue-rotate(65deg);transform:scale(1.06)}}
header{background:linear-gradient(125deg,rgba(34,211,238,.11),rgba(255,255,255,.025) 45%,rgba(167,139,250,.13)),#0c1220;border-color:rgba(103,232,249,.28);box-shadow:0 26px 60px -26px #000,0 0 0 1px rgba(34,211,238,.1),0 0 48px -20px rgba(34,211,238,.55),inset 0 1px 0 rgba(255,255,255,.12)}
header::before{background:conic-gradient(from 0deg,rgba(34,211,238,.32),rgba(167,139,250,.28),rgba(244,114,182,.25),rgba(52,211,153,.28),rgba(34,211,238,.32));filter:blur(8px);animation:ambientShift 9s linear infinite alternate}
.logo{background:linear-gradient(135deg,#22d3ee,#8b5cf6,#ec4899);box-shadow:0 14px 34px -8px rgba(34,211,238,.65),inset 0 1.5px 0 rgba(255,255,255,.5)}
.logo::before{background:conic-gradient(from 210deg,#67e8f9,rgba(103,232,249,0) 28%,#a78bfa00 45%,#ec4899 70%,#67e8f9);animation:spinBorder 8s linear infinite}
@keyframes spinBorder{to{transform:rotate(360deg)}}
.tab.on,.btn.primary,.primary{background:var(--accg)!important;background-size:220% 220%!important;animation:gradientFlow 7s ease infinite;color:#07111b!important;border-color:transparent!important}
@keyframes gradientFlow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.card,.box,.searchbar,.item,.result{border-color:rgba(103,232,249,.15)}
.card:hover,.box:hover{border-color:rgba(167,139,250,.55)!important;box-shadow:0 12px 36px -20px rgba(34,211,238,.45)}
.hr{background:linear-gradient(90deg,transparent,rgba(34,211,238,.55),rgba(167,139,250,.65),rgba(244,114,182,.5),transparent)!important;animation:gradientFlow 10s ease infinite;background-size:220% 100%!important}
#musicDock{display:flex;align-items:center;gap:11px;margin:12px 0 16px;padding:11px 13px;border:1px solid rgba(103,232,249,.28);border-radius:18px;background:linear-gradient(110deg,rgba(34,211,238,.11),rgba(167,139,250,.11),rgba(244,114,182,.08));box-shadow:0 12px 30px -20px rgba(34,211,238,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#musicToggle{display:grid;place-items:center;width:40px;height:40px;flex:none;border:0;border-radius:13px;color:#07111b;background:var(--accg);background-size:220% 220%;animation:gradientFlow 7s ease infinite;font-size:17px;font-weight:800;cursor:pointer}
#musicToggle:focus-visible{outline:2px solid #fff;outline-offset:3px}
#musicMeta{min-width:0;flex:1}#musicMeta strong{display:block;font-size:13px;letter-spacing:.02em}#musicMeta span{display:block;color:var(--mut);font-size:11px}
#musicBars{height:22px;display:flex;align-items:center;gap:3px;flex:none}
#musicBars i{display:block;width:3px;height:5px;border-radius:5px;background:linear-gradient(#22d3ee,#c084fc);opacity:.7}
#musicDock.playing #musicBars i{animation:musicWave .8s ease-in-out infinite alternate}
